version: '3.8'

services:
  mysql_test1:
    image: mysql:latest
    container_name: mysql_test
    restart: always
    environment:
      MYSQL_DATABASE: book_management
      MYSQL_ROOT_PASSWORD: ${PASSWORD}
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_test:/var/lib/mysql
    networks:
      - test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  test:
volumes:
  mysql_test:
